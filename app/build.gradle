plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'com.google.devtools.ksp'
}

def hasCiKey = file("${rootDir}/ci/release.keystore").exists()

android {
    namespace 'com.family.daily'
    compileSdk 34
    defaultConfig {
        applicationId "com.family.daily"
        minSdk 26; targetSdk 34; versionCode 38; versionName "1.2"
    }
    signingConfigs {
        ci {
            storeFile file("${rootDir}/ci/release.keystore")
            storePassword 'family123'
            keyAlias 'family'
            keyPassword 'family123'
        }
    }
    buildTypes {
        debug { if (hasCiKey) signingConfig signingConfigs.ci }
        release {
            minifyEnabled false
            if (hasCiKey) signingConfig signingConfigs.ci
        }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    kotlinOptions { jvmTarget = '17' }
}
dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.viewpager2:viewpager2:1.1.0'
    implementation 'androidx.room:room-runtime:2.6.1'
    implementation 'androidx.room:room-ktx:2.6.1'
    ksp 'androidx.room:room-compiler:2.6.1'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.8.3'
    implementation 'androidx.work:work-runtime-ktx:2.9.0'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.0'
}
