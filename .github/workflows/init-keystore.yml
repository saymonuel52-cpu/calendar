name: Init keystore
on: workflow_dispatch
permissions:
  contents: write
jobs:
  init:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - name: Generate keystore
        run: |
          mkdir -p ci
          keytool -genkeypair -v -keystore ci/release.keystore -alias family \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass family123 -keypass family123 \
            -dname "CN=Family Daily, OU=Dev, O=Family, C=RU"
      - name: Commit keystore
        run: |
          git config user.name "CI"
          git config user.email "ci@local"
          git add ci/release.keystore
          git commit -m "ci: stable signing keystore"
          git push
