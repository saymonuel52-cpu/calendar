name: Build
on: [push, workflow_dispatch]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Ensure stable keystore (auto)
        run: |
          if [ ! -f ci/release.keystore ]; then
            mkdir -p ci
            keytool -genkeypair -v -keystore ci/release.keystore -alias family \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass family123 -keypass family123 \
              -dname "CN=Family Daily, OU=Dev, O=Family, C=RU"
            git config user.name "CI"
            git config user.email "ci@local"
            git add ci/release.keystore
            git commit -m "ci: auto-generated stable keystore"
            git push https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git HEAD:${{ github.ref_name }} || true
          fi

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept SDK licenses
        run: yes | sdkmanager --licenses || true

      - name: Generate Gradle Wrapper
        run: |
          gradle wrapper --gradle-version 8.7 --distribution-type bin
          chmod +x gradlew

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
